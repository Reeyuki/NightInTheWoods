<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Night in the Woods</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #1F1F20;
        overflow: hidden;
      }
      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #1F1F20;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #1F1F20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        font-family: monospace;
        color: #e8d5a3;
      }
      #loading-title {
        font-size: 22px;
        margin-bottom: 32px;
        letter-spacing: 2px;
        opacity: 0.9;
      }
      #loading-status {
        font-size: 14px;
        margin-bottom: 12px;
        opacity: 0.7;
        min-height: 18px;
      }
      #loading-bar-wrap {
        width: 320px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 14px;
      }
      #loading-bar {
        height: 100%;
        width: 0%;
        background: #e8d5a3;
        border-radius: 3px;
        transition: width 0.2s ease;
      }
      #loading-mb {
        font-size: 13px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-title">NIGHT IN THE WOODS(AUDIO DOES NOT WORK)</div>
      <div id="loading-status">Loading...</div>
      <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
      <div id="loading-mb"></div>
    </div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
      const DATA_PARTS   = 17;
      const WASM_PARTS   = 3;
      const TOTAL_MB     = 326 + 41;
      const TOTAL_BYTES  = TOTAL_MB * 1024 * 1024;

      const elStatus = document.getElementById('loading-status');
      const elBar    = document.getElementById('loading-bar');
      const elMb     = document.getElementById('loading-mb');

      let downloadedBytes = 0;

      function updateProgress(addedBytes, label) {
        downloadedBytes += addedBytes;
        const downloaded = (downloadedBytes / (1024 * 1024)).toFixed(1);
        const total      = TOTAL_MB.toFixed(1);
        const pct        = Math.min(100, (downloadedBytes / TOTAL_BYTES) * 100);
        elBar.style.width = pct + '%';
        elMb.textContent  = downloaded + ' MB / ' + total + ' MB';
        if (label) elStatus.textContent = label;
      }

      async function fetchParts(baseName, ext, numParts, label) {
        const chunks = [];
        for (let i = 0; i < numParts; i++) {
          const suffix = String(i).padStart(3, '0');
          const url    = CDN + '/Build/parts/' + baseName + '.part' + suffix;
          elStatus.textContent = label + ' (' + (i + 1) + '/' + numParts + ')';
          const resp  = await fetch(url);
          const buf   = await resp.arrayBuffer();
          updateProgress(buf.byteLength);
          chunks.push(buf);
        }
        const total  = chunks.reduce((s, c) => s + c.byteLength, 0);
        const merged = new Uint8Array(total);
        let offset   = 0;
        for (const c of chunks) {
          merged.set(new Uint8Array(c), offset);
          offset += c.byteLength;
        }
        return merged.buffer;
      }

      const CDN = 'https://cdn.jsdelivr.net/gh/Reeyuki/NightInTheWoods';

      async function fetchSmall(path, label) {
        elStatus.textContent = label;
        const resp = await fetch(CDN + '/' + path);
        const text = await resp.text();
        return text;
      }

      async function boot() {
        const loaderText = await fetchSmall(
          'Build/bb0d9ecdb05db3e84da20bd14a4f84dc.loader.js',
          'Loading engine...'
        );
        const scriptEl = document.createElement('script');
        scriptEl.textContent = loaderText;
        document.head.appendChild(scriptEl);

        const frameworkText = await fetchSmall(
          'Build/5eb531593953ed3f9d46bf9232472a14.framework.js',
          'Loading framework...'
        );

        const dataBuf  = await fetchParts('1be89627d83a99b9ed0f73daf7c701b0.data', 'data', DATA_PARTS, 'Downloading game data');
        const wasmBuf  = await fetchParts('d50f42928f17ee1efc318f292db2df90.wasm', 'wasm', WASM_PARTS, 'Downloading engine code');

        elStatus.textContent = 'Starting...';
        elBar.style.width    = '100%';

        const dataBlob      = new Blob([dataBuf],  { type: 'application/octet-stream' });
        const wasmBlob      = new Blob([wasmBuf],  { type: 'application/wasm' });
        const frameworkBlob = new Blob([frameworkText], { type: 'application/javascript' });
        const dataUrl       = URL.createObjectURL(dataBlob);
        const wasmUrl       = URL.createObjectURL(wasmBlob);
        const frameworkUrl  = URL.createObjectURL(frameworkBlob);

        createUnityInstance(document.querySelector('#unity-canvas'), {
          dataUrl:             dataUrl,
          frameworkUrl:        frameworkUrl,
          codeUrl:             wasmUrl,
          streamingAssetsUrl:  CDN + '/StreamingAssets',
          companyName:         'Infinite Fall',
          productName:         'Night in the Woods',
          productVersion:      '1.0',
        }).then(function() {
          document.getElementById('loading-screen').style.display = 'none';
          URL.revokeObjectURL(dataUrl);
          URL.revokeObjectURL(wasmUrl);
          URL.revokeObjectURL(frameworkUrl);
        });
      }

      boot().catch(function(err) {
        elStatus.textContent = 'Error: ' + err.message;
        console.error(err);
      });
    </script>
  </body>
</html>
